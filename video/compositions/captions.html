<template>

    @font-face {
      font-family: "Instrument Sans";
      src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
      font-weight: 400 600;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Instrument Sans", system-ui, sans-serif;
      pointer-events: none;
    }
    .cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 108px;
      text-align: center;
      overflow: visible;
    }
    .cap > span {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e4e4e0;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.2;
      color: #16181d;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <!-- Generated by tools/build-captions.mjs from assets/vo2/*.words.json. One group at a time, timed to the voice. -->
    <div id="cap01" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="0.31" data-duration="1.17" data-track-index="0"><span>Your coding agent</span></div>
    <div id="cap02" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="1.53" data-duration="1.83" data-track-index="0"><span>just made every test pass.</span></div>
    <div id="cap03" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="3.41" data-duration="1.90" data-track-index="0"><span>By changing the test.</span></div>
    <div id="cap04" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="16.01" data-duration="1.17" data-track-index="0"><span>Andon is the stop cord</span></div>
    <div id="cap05" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="17.23" data-duration="1.33" data-track-index="0"><span>for coding agents.</span></div>
    <div id="cap06" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="33.71" data-duration="1.99" data-track-index="0"><span>It shows the exact line it caught.</span></div>
    <div id="cap07" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="41.61" data-duration="1.54" data-track-index="0"><span>Ten of ten cheats caught,</span></div>
    <div id="cap08" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="43.20" data-duration="1.86" data-track-index="0"><span>on changes it never saw.</span></div>
    <div id="cap09" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="49.51" data-duration="2.09" data-track-index="0"><span>CI tells you the tests passed.</span></div>
    <div id="cap10" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="51.89" data-duration="1.02" data-track-index="0"><span>Andon tells you</span></div>
    <div id="cap11" class="cap clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="52.96" data-duration="1.33" data-track-index="0"><span>if they were earned.</span></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Words arrive light grey to ink, 70 ms apart; the group fades 120 ms before its end.
    document.querySelectorAll("#root .cap").forEach((cap) => {
      const start = parseFloat(cap.dataset.start);
      const end = start + parseFloat(cap.dataset.duration);
      const box = cap.querySelector("span");
      const words = box.textContent.split(" ");
      box.textContent = "";
      words.forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "w";
        s.textContent = (i ? " " : "") + w;
        box.appendChild(s);
      });
      const ws = box.querySelectorAll(".w");
      tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, start);
      tl.fromTo(ws, { color: "#b9bbc0" }, { color: "#16181d", duration: 0.12, ease: "power2.out", stagger: 0.07 }, start);
      tl.to(box, { opacity: 0, duration: 0.12, ease: "power2.in" }, end - 0.12);
    });
    window.__timelines = window.__timelines || {};
    window.__timelines["captions"] = tl;
    tl.seek(0);
  </script>
</template>
