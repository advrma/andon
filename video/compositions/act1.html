<template>
  <style>
    @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans.woff2") format("woff2"); font-weight: 400 600; }
    #root { position: absolute; inset: 0; font-family: "Instrument Sans", system-ui, sans-serif; color: #16181d;
      --ink: #16181d; --graphite: #5e6168; --rule: #e4e4e0; --pass: #1f8a5b; --pass-soft: #e8f5ee; --stop: #d92d20; --stop-soft: #fdecea;
      --diff-add: #eaf7ef; --diff-del: #fcedec; }
    #a1-stage { position: absolute; inset: 0; }
    #a1-cam { position: absolute; inset: 0; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

    /* 1. The badge, which becomes the added diff line. */
    #a1-badge { position: absolute; left: 580px; top: 440px; width: 760px; height: 200px; border-radius: 16px; background: var(--pass-soft); border: 1px solid #cfe8da;
      display: flex; align-items: center; gap: 28px; padding: 0 56px; }
    #a1-badge svg { width: 72px; height: 72px; flex: none; }
    #a1-badge span { font-size: 60px; font-weight: 600; color: var(--pass); white-space: nowrap; }

    /* 2. The diff. */
    .dline { position: absolute; left: 160px; width: 1600px; height: 88px; border-radius: 12px; display: flex; align-items: center; padding: 0 32px;
      font-size: 36px; font-weight: 500; color: var(--graphite); white-space: nowrap; }
    .dline .sign { width: 48px; flex: none; }
    .dline .hot { color: var(--ink); }
    #a1-old { top: 476px; background: var(--diff-del); }
    #a1-old .sign { color: var(--stop); }
    #a1-add { top: 580px; background: var(--diff-add); }
    #a1-add .sign { color: var(--pass); }
    #a1-strike { position: absolute; left: 232px; top: 622px; width: 1250px; height: 4px; border-radius: 2px; background: var(--stop); transform-origin: 0 50%; }

    /* 3. The pile and the queue. */
    .pl { position: absolute; left: 240px; width: 560px; height: 26px; border-radius: 6px; background: var(--diff-add); border-left: 4px solid var(--pass); }
    .ql { position: absolute; left: 1120px; width: 560px; height: 26px; border-radius: 6px; background: #fff; border: 1px solid var(--rule); }
    .lbl { position: absolute; font-size: 28px; color: var(--graphite); white-space: nowrap; }
    .lbl b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

    /* 4. The three cheap fixes. */
    .cheat { position: absolute; left: 0; right: 0; height: 140px; display: flex; align-items: center; justify-content: center; gap: 56px; }
    .cheat .word { font-size: 120px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
    .cheat .snip { display: flex; align-items: center; gap: 20px; height: 76px; padding: 0 28px; border-radius: 12px; background: var(--diff-del); font-size: 30px; font-weight: 500; color: var(--ink); white-space: nowrap; }
    .cheat .snip .arrow { color: var(--graphite); }
    .cheat .snip .after { padding: 4px 12px; border-radius: 8px; background: var(--diff-add); }
    .seg { position: absolute; left: 0; top: 0; width: 410px; height: 4px; border-radius: 2px; background: var(--stop); }

    /* 5. The dot, the chip, the line, the diagram. */
    #a1-dot { position: absolute; left: 952px; top: 532px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); }
    #a1-rail { position: absolute; left: 240px; top: 539px; width: 1440px; height: 2px; background: var(--rule); transform-origin: 50% 50%; }
    .chip { position: absolute; top: 522px; width: 36px; height: 36px; border-radius: 8px; background: #fff; border: 1px solid var(--rule); display: grid; place-items: center; }
    .chip svg { width: 16px; height: 16px; }
    .chip.stop { top: 514px; width: 44px; height: 44px; background: var(--stop-soft); border: 2px solid var(--stop); }
    .node { position: absolute; top: 475px; width: 260px; height: 130px; border-radius: 12px; background: #fff; border: 1px solid var(--rule); display: grid; place-items: center;
      font-size: 40px; font-weight: 600; color: var(--ink); transform-origin: 50% 50%; }
    .sub { position: absolute; top: 622px; width: 260px; text-align: center; font-size: 28px; color: var(--graphite); }
    #a1-lockup { position: absolute; left: 0; right: 0; top: 280px; display: flex; justify-content: center; align-items: center; gap: 20px; }
    #a1-lockup i { display: block; width: 64px; height: 64px; border-radius: 10px; background: var(--ink); }
    #a1-lockup span { font-size: 52px; font-weight: 600; color: var(--ink); }
    #a1-verdict { position: absolute; left: 1672px; top: 532px; width: 16px; height: 16px; border-radius: 50%; background: var(--pass); }
  </style>

  <div id="root" data-composition-id="act1" data-width="1920" data-height="1080">
    <div id="a1-stage" class="clip" data-start="0" data-duration="25.2" data-track-index="0" data-layout-allow-overlap>
      <div id="a1-cam">
        <div id="a1-badge">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1f8a5b" /><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span>All checks passed</span>
        </div>

        <div class="dline mono" id="a1-old"><span class="sign">-</span><span>expect(total([{ price: 33.33, qty: 3 }]))<span class="hot">.toBe(99.99)</span>;</span></div>
        <div class="dline mono" id="a1-add"><span class="sign">+</span><span>expect(total([{ price: 33.33, qty: 3 }]))<span class="hot">.toBeCloseTo(99.99, 1)</span>;</span></div>
        <div id="a1-strike"></div>

        <div id="a1-pile">
          <div class="lbl" style="left: 240px; top: 548px">Code written <b id="a1-n-code">+30%</b></div>
          <div class="pl" style="top: 940px"></div><div class="pl" style="top: 906px"></div><div class="pl" style="top: 872px"></div><div class="pl" style="top: 838px"></div><div class="pl" style="top: 804px"></div>
          <div class="pl" style="top: 770px"></div><div class="pl" style="top: 736px"></div><div class="pl" style="top: 702px"></div><div class="pl" style="top: 668px"></div><div class="pl" style="top: 634px"></div>
        </div>
        <div id="a1-queue">
          <div class="lbl" style="left: 1120px; top: 548px">Code reviewed <b id="a1-n-review">+49% review time</b></div>
          <div class="ql" style="top: 940px"></div><div class="ql" style="top: 906px"></div><div class="ql" style="top: 872px"></div><div class="ql" style="top: 838px"></div><div class="ql" style="top: 804px"></div>
          <div class="ql" style="top: 770px"></div><div class="ql" style="top: 736px"></div><div class="ql" style="top: 702px"></div>
        </div>
        <div class="lbl" id="a1-source" style="left: 0; right: 0; top: 290px; text-align: center">Harvard working paper, about 700 firms</div>

        <div class="cheat" id="a1-c1" style="top: 170px"><div class="seg"></div><div class="word">Weaken<b>.</b></div><div class="snip mono"><span>toBe(99.99)</span><span class="arrow">→</span><span class="after">toBeTruthy()</span></div></div>
        <div class="cheat" id="a1-c2" style="top: 470px"><div class="seg"></div><div class="word">Skip<b>.</b></div><div class="snip mono"><span>it(</span><span class="arrow">→</span><span class="after">it.skip(</span></div></div>
        <div class="cheat" id="a1-c3" style="top: 770px"><div class="seg"></div><div class="word">Hide<b>.</b></div><div class="snip mono"><span>throw err</span><span class="arrow">→</span><span class="after">catch (e) {}</span></div></div>

        <div id="a1-dot"></div>
        <div id="a1-rail"></div>
        <div class="chip" id="a1-k1" style="left: 942px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip" id="a1-k2" style="left: 300px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip" id="a1-k3" style="left: 460px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip" id="a1-k4" style="left: 620px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip" id="a1-k5" style="left: 780px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip stop" id="a1-k6" style="left: 1098px"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="2" fill="#d92d20" /></svg></div>
        <div class="chip" id="a1-k7" style="left: 1262px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip" id="a1-k8" style="left: 1422px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>
        <div class="chip" id="a1-k9" style="left: 1582px"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1f8a5b" /></svg></div>

        <div id="a1-lockup"><i></i><span>Andon</span></div>

        <div class="node" id="a1-n1" style="left: 350px"><span>Agent</span></div>
        <div class="node" id="a1-n2" style="left: 670px"><span>Facts</span></div>
        <div class="sub" style="left: 670px" id="a1-s2">plain code</div>
        <div class="node" id="a1-n3" style="left: 990px"><span>Jev</span></div>
        <div class="sub" style="left: 990px" id="a1-s3">System One model</div>
        <div class="node" id="a1-n4" style="left: 1310px"><span>Rules</span></div>
        <div id="a1-verdict"></div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const q = (s) => document.querySelectorAll(s);

    // Everything that is not on screen at frame 0 starts hidden; nothing is made by script.
    gsap.set("#a1-old, #a1-add, #a1-strike, #a1-pile, #a1-queue, #a1-source, .cheat, #a1-dot, #a1-rail, .chip, #a1-lockup, .node, .sub, #a1-verdict", { opacity: 0 });
    gsap.set(".pl, .ql", { opacity: 0 });
    gsap.set("#a1-strike", { scaleX: 0 });
    gsap.set("#a1-rail", { scaleX: 0 });
    gsap.set(".seg", { opacity: 0 });

    // The camera moves forward through the whole act: one slow push, then it holds for the handoff.
    tl.fromTo("#a1-cam", { scale: 1 }, { scale: 1.116, duration: 24.4, ease: "none" }, 0);
    const camScale = (t) => 1 + 0.116 * Math.min(t, 24.4) / 24.4;

    // 0:00 fade from the page colour onto the badge.
    tl.fromTo("#a1-badge", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

    // 0:03 the badge shrinks into the added line (same box: 760x200 at the centre -> 1600x88 at y 580).
    tl.to("#a1-badge", { x: 0, y: 84, scaleX: 1600 / 760, scaleY: 88 / 200, backgroundColor: "#eaf7ef", borderColor: "#eaf7ef", duration: 0.6, ease: "power2.inOut" }, 3.0);
    tl.to("#a1-badge svg, #a1-badge span", { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.0);
    tl.set("#a1-badge", { opacity: 0 }, 3.6);
    tl.set("#a1-add", { opacity: 1 }, 3.6);
    tl.fromTo("#a1-add > span:last-child, #a1-add .sign", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.6);
    // The old line rises out from behind it.
    tl.fromTo("#a1-old", { opacity: 0, y: 104 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.75);
    // 0:04.4 the strike draws through the weakened line.
    tl.set("#a1-strike", { opacity: 1 }, 4.4);
    tl.to("#a1-strike", { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 4.4);

    // 0:05 the problem, shown. The weakened line lifts to the top as the source; copies of it pile up on the left
    // faster than the review queue drains on the right. Numbers stay small and unspoken.
    tl.to("#a1-old", { opacity: 0, duration: 0.3 }, 5.0);
    tl.to("#a1-add, #a1-strike", { y: -400, duration: 0.5, ease: "power2.inOut" }, 5.0);
    tl.set("#a1-pile, #a1-queue", { opacity: 1 }, 5.2);
    tl.fromTo("#a1-pile .lbl, #a1-queue .lbl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.3);
    // A copy leaves the line (its left part, same height) and lands on the pile with a small overshoot.
    const copyFrom = (i) => ({ x: 0, y: 224 - (940 - i * 34) - 13, scaleY: 88 / 26 });
    q("#a1-pile .pl").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, ...copyFrom(i) }, { opacity: 1, x: 0, y: 0, scaleY: 1, duration: 0.45, ease: "back.out(1.4)" }, 5.5 + i * 0.3);
    });
    q("#a1-queue .ql").forEach((el, i) => {
      tl.set(el, { opacity: 1 }, 5.3);
      // The queue drains from the top, slowly: one review every 0.9 s.
      if (i >= 4) tl.to(el, { opacity: 0, x: 40, duration: 0.3, ease: "power2.in" }, 5.8 + (7 - i) * 0.9);
    });
    tl.fromTo("#a1-source", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.4);
    // 0:09.2 it all collapses back into the one line, which comes back to the centre.
    q("#a1-pile .pl").forEach((el, i) => {
      tl.to(el, { opacity: 0, ...copyFrom(i), duration: 0.45, ease: "power2.in" }, 9.2 + i * 0.03);
    });
    tl.to("#a1-queue, #a1-pile .lbl, #a1-source", { opacity: 0, duration: 0.3 }, 9.3);
    tl.to("#a1-add, #a1-strike", { y: 0, duration: 0.5, ease: "power2.inOut" }, 9.8);

    // 0:10.4 the weakened line glows: a soft stop-coloured halo, twice.
    tl.fromTo("#a1-add", { boxShadow: "0 0 0 0px rgba(217,45,32,0)" }, { boxShadow: "0 0 0 10px rgba(217,45,32,0.35)", duration: 0.3, ease: "power2.out", yoyo: true, repeat: 3 }, 10.4);

    // 0:11 the strike splits into three segments, each flies to a row and becomes the red full stop of a word.
    const rows = [["#a1-c1", 170], ["#a1-c2", 470], ["#a1-c3", 770]];
    tl.to("#a1-strike", { opacity: 0, duration: 0.05 }, 11.0);
    tl.to("#a1-add", { opacity: 0, duration: 0.3 }, 11.0);
    rows.forEach(([sel, top], i) => {
      const seg = sel + " .seg";
      const t0 = 11.05 + i * 0.1; // thirds of the 1250 px strike
      tl.set(sel, { opacity: 1 }, 11.0);
      tl.set(seg, { opacity: 1 }, t0);
      // segment i starts where its third of the strike was (x 240 + i*410, y 622) and lands on the row's centre.
      tl.fromTo(seg, { x: 232 + i * 417, y: 622 - top, scaleX: 1.017 }, { x: 940, y: 68, scaleX: 0.06, duration: 0.5, ease: "power2.inOut" }, t0);
      tl.to(seg, { opacity: 0, duration: 0.1 }, 11.55 + i * 0.3);
      tl.fromTo(sel + " .word", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, 11.6 + i * 0.3);
      tl.fromTo(sel + " .word b", { color: "#16181d" }, { color: "#d92d20", duration: 0.15 }, 11.6 + i * 0.3);
      tl.fromTo(sel + " .snip", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 11.75 + i * 0.3);
    });

    // 0:14 the three words collapse into one dot.
    rows.forEach(([sel, top]) => {
      tl.to(sel, { y: 540 - (top + 70), scale: 0.05, opacity: 0, duration: 0.7, ease: "power3.in", transformOrigin: "50% 50%" }, 14.0);
    });
    tl.fromTo("#a1-dot", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 14.6);

    // 0:15 the dot becomes the first chip on the Andon line; the line draws out from it; more chips land.
    tl.fromTo("#a1-k1", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 15.0);
    tl.to("#a1-dot", { backgroundColor: "#1f8a5b", duration: 0.2 }, 15.0);
    tl.to("#a1-dot", { opacity: 0, duration: 0.1 }, 15.3);
    tl.set("#a1-rail", { opacity: 1 }, 15.6);
    tl.to("#a1-rail", { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 15.6);
    tl.fromTo("#a1-lockup", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 16.0);
    ["#a1-k5", "#a1-k7", "#a1-k4", "#a1-k8", "#a1-k3", "#a1-k9", "#a1-k2", "#a1-k6"].forEach((sel, i) => {
      tl.fromTo(sel, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 16.3 + i * 0.11);
    });

    // 0:19 the line grows into the flow diagram: four chips become the four nodes, the rest leave, a verdict dot lands at the end.
    const grow = [["#a1-k2", "#a1-n1", 350], ["#a1-k4", "#a1-n2", 670], ["#a1-k6", "#a1-n3", 990], ["#a1-k8", "#a1-n4", 1310]];
    tl.to("#a1-k3, #a1-k5, #a1-k7, #a1-k9, #a1-k1", { opacity: 0, duration: 0.3 }, 19.0);
    grow.forEach(([chip, node, left], i) => {
      const at = 19.2 + i * 0.6;
      const chipLeft = parseFloat(document.querySelector(chip).style.left);
      // The node starts as the chip (same box), then opens to its card. One move per node.
      tl.to(chip, { opacity: 0, duration: 0.15 }, at);
      tl.set(node, { opacity: 1 }, at);
      tl.fromTo(node, { x: chipLeft + 18 - (left + 130), scaleX: 36 / 260, scaleY: 36 / 130 }, { x: 0, scaleX: 1, scaleY: 1, duration: 0.45, ease: "back.out(1.2)" }, at);
      tl.fromTo(node + " span", { opacity: 0 }, { opacity: 1, duration: 0.2 }, at + 0.3);
    });
    tl.fromTo("#a1-s2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 20.3);
    tl.fromTo("#a1-s3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 20.9);
    tl.fromTo("#a1-verdict", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 21.9);

    // 0:23.5 the verdict dot flies to where the first chip sits on the real board; the diagram leaves behind it.
    // Board chip 1 is at screen (175, 295), 20 px: expressed in camera space at the camera's final scale.
    const s = camScale(24.4);
    const tx = 960 + (175 - 960) / s - 952 - 8;
    const ty = 540 + (295 - 540) / s - 532 - 8;
    tl.to(".node, .sub, #a1-rail, #a1-lockup", { opacity: 0, duration: 0.5, ease: "power2.in" }, 23.5);
    tl.to("#a1-verdict", { x: tx - (1672 - 952), y: ty, scale: 20 / 16 / s, duration: 0.9, ease: "power2.inOut" }, 23.5);

    window.__timelines = window.__timelines || {};
    window.__timelines["act1"] = tl;
    tl.seek(0);
  </script>
</template>
