<template>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
      font-weight: 400 600;
    }
    #root {
      position: absolute;
      inset: 0;
      font-family: "Instrument Sans", system-ui, sans-serif;
      --ink: #16181d;
      --graphite: #5e6168;
    }
    #num-stage {
      position: absolute;
      inset: 0;
    }
    .stat {
      position: absolute;
      top: 330px;
      width: 760px;
      text-align: center;
    }
    #num-a {
      left: 580px;
    }
    #num-b {
      left: 1000px;
    }
    .big {
      font-size: 180px;
      font-weight: 600;
      line-height: 1;
      color: var(--ink);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .label {
      margin-top: 20px;
      font-size: 48px;
      color: var(--graphite);
    }
    #num-source {
      position: absolute;
      left: 0;
      right: 0;
      top: 800px;
      text-align: center;
      font-size: 28px;
      color: var(--graphite);
    }
  </style>

  <div id="root" data-composition-id="numbers" data-width="1920" data-height="1080">
    <div id="num-stage" class="clip" data-start="0" data-duration="6.3" data-track-index="0">
     <div id="num-fade" style="position: absolute; inset: 0">
      <div class="stat" id="num-a">
        <div class="big"><span id="num-a-val">+0%</span></div>
        <div class="label">more code</div>
      </div>
      <div class="stat" id="num-b">
        <div class="big"><span id="num-b-val">+0%</span></div>
        <div class="label">review time</div>
      </div>
      <div id="num-source">Harvard working paper, about 700 firms</div>
     </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const FPS = 30;
    // Each frame's text is set on the timeline, so any seek shows the same digits.
    function countUp(sel, end, at, dur) {
      const frames = Math.round(dur * FPS);
      const ease = gsap.parseEase("power3.out");
      for (let f = 0; f <= frames; f++) {
        const v = Math.round(end * ease(f / frames));
        tl.set(sel, { textContent: "+" + v + "%" }, at + f / FPS);
      }
    }

    // Crossfade in from the diff.
    tl.fromTo("#num-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
    gsap.set("#num-b", { opacity: 0 });
    gsap.set("#num-source", { opacity: 0 });

    // 0:06 "+30%" lands in the centre and counts up.
    tl.fromTo("#num-a", { x: 0, scale: 1 }, { x: 0, scale: 1, duration: 0.01 }, 0);
    countUp("#num-a-val", 30, 0, 0.6);

    // 0:09 it slides left and shrinks; "+49%" lands right and counts up.
    tl.to("#num-a", { x: -420, scale: 0.6, duration: 0.5, ease: "power2.inOut" }, 3.0);
    tl.fromTo("#num-b", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 3.2);
    countUp("#num-b-val", 49, 3.3, 0.6);
    tl.to("#num-source", { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.6);

    // Crossfade out.
    tl.to("#num-fade", { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.0);
    window.__timelines = window.__timelines || {};
    window.__timelines["numbers"] = tl;
    tl.seek(0);
  </script>
</template>
