    tl.to("#s-redbar", { scaleX: 1, duration: 0.3, ease: "power2.out" }, STOP);

    tl.to("#s-pill-stop", { opacity: 1, duration: 0.15 }, STOP + 0.1);
    tl.set("#s-before", { opacity: 0 }, STOP + 0.1);
