<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"repo_url","type":"string","label":"Repo URL","default":"github.com/aayushswami123/andon"},
    {"id":"promise_1","type":"string","label":"Closing line 1","default":"CI tells you the tests passed."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --surface: #f7f7f5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--surface);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- Three acts, handed off through an identical object at each seam (match cut), never a crossfade or a hard cut. -->
      <div id="act1" class="clip" data-composition-id="act1" data-composition-src="compositions/act1.html" data-start="0" data-duration="25.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="board2" class="clip" data-composition-id="board2" data-composition-src="compositions/board2.html" data-start="24.6" data-duration="23.8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="close2" class="clip" data-composition-id="close2" data-composition-src="compositions/close2.html" data-start="48.2" data-duration="11.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="60" data-track-index="3" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- Voice: 6 lines, 50 words, Cartesia TTS, silence trimmed. -->
      <audio id="vo01" class="clip" src="assets/vo2/01.wav" data-start="0.3" data-duration="2.86" data-track-index="4" data-volume="1"></audio>
      <audio id="vo02" class="clip" src="assets/vo2/02.wav" data-start="3.4" data-duration="1.56" data-track-index="4" data-volume="1"></audio>
      <audio id="vo03" class="clip" src="assets/vo2/03.wav" data-start="16" data-duration="2.21" data-track-index="4" data-volume="1"></audio>
      <audio id="vo04" class="clip" src="assets/vo2/04.wav" data-start="33.7" data-duration="1.67" data-track-index="4" data-volume="1"></audio>
      <audio id="vo05" class="clip" src="assets/vo2/05.wav" data-start="41.6" data-duration="3.11" data-track-index="4" data-volume="1"></audio>
      <audio id="vo06" class="clip" src="assets/vo2/06.wav" data-start="49.5" data-duration="4.47" data-track-index="4" data-volume="1"></audio>

      <!-- Sound on visible actions; each file's peak lands one frame after its picture (pop peaks at 0.12 s, key-press 0.076, whoosh 0.162, impact 0.073). -->
      <audio id="sfx-pop-badge" class="clip" src="assets/sfx/pop.mp3" data-start="3.51" data-duration="0.72" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-whoosh-split" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.87" data-duration="0.58" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-tick-weaken" class="clip" src="assets/sfx/key-press.mp3" data-start="11.56" data-duration="0.28" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-tick-skip" class="clip" src="assets/sfx/key-press.mp3" data-start="11.86" data-duration="0.28" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-tick-hide" class="clip" src="assets/sfx/key-press.mp3" data-start="12.16" data-duration="0.28" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-pop-dot" class="clip" src="assets/sfx/pop.mp3" data-start="14.71" data-duration="0.72" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-tick-n1" class="clip" src="assets/sfx/key-press.mp3" data-start="19.46" data-duration="0.4" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-tick-n2" class="clip" src="assets/sfx/key-press.mp3" data-start="20.06" data-duration="0.4" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-tick-n3" class="clip" src="assets/sfx/key-press.mp3" data-start="20.66" data-duration="0.4" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-tick-n4" class="clip" src="assets/sfx/key-press.mp3" data-start="21.26" data-duration="0.4" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-chip2" class="clip" src="assets/sfx/pop.mp3" data-start="27.01" data-duration="0.72" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-chip3" class="clip" src="assets/sfx/pop.mp3" data-start="28.61" data-duration="0.72" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-chip4" class="clip" src="assets/sfx/pop.mp3" data-start="30.21" data-duration="0.72" data-track-index="5" data-volume="0.5"></audio>
      <!-- The one bold moment: the impact's peak lands one frame after the line stops at 31.0. -->
      <audio id="sfx-clunk" class="clip" src="assets/sfx/clunk.mp3" data-start="30.96" data-duration="2.1" data-track-index="5" data-volume="0.75"></audio>
      <audio id="sfx-pop-score" class="clip" src="assets/sfx/pop.mp3" data-start="40.81" data-duration="0.72" data-track-index="5" data-volume="0.5"></audio>

      <!-- Bed. assets/music.mp3 was not present, so the synthesized pulse (-33 LUFS in the file) stands in; swap the src and keep the timing.
           Fade in 1 s; ducked about 10 dB under the voice; builds through the green chips; cut dead on the stop frame (31.0);
           back softer at 32.1 after about a second of silence; 2 s fade under the closing card. -->
      <audio id="bed-a" class="clip" src="assets/music/pulse.wav" data-start="0" data-duration="31" data-track-index="6" data-volume="3.3" data-fade-in="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.48},{"t":5.2,"v":0.48},{"t":5.8,"v":0.85},{"t":15.7,"v":0.85},{"t":16,"v":0.48},{"t":18.3,"v":0.48},{"t":18.8,"v":0.85},{"t":25,"v":0.85},{"t":30.9,"v":1}]}]}'></audio>
      <audio id="bed-b" class="clip" src="assets/music/pulse.wav" data-start="32.1" data-duration="27.4" data-media-start="32.1" data-track-index="6" data-volume="1.8" data-fade-in="0.6" data-fade-out="2"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":1.3,"v":1},{"t":1.6,"v":0.61},{"t":3.4,"v":0.61},{"t":3.9,"v":1},{"t":9.2,"v":1},{"t":9.5,"v":0.61},{"t":12.7,"v":0.61},{"t":13.2,"v":1},{"t":17.1,"v":1},{"t":17.4,"v":0.61},{"t":22,"v":0.61},{"t":22.5,"v":1}]}]}'></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
